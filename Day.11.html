<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 
    <style>

        body{ 
            font-family: Arial, Helvetica, sans-serif; 
            margin: 20px;
        }

        .notification{ 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            background-color: red; 
            border: 2px solid green; 
            padding: 15px 25px;
        } 

        .content{ 
            height: 1500px;
        }

    </style>

</head>
<body>

    <h1>Welcome the page</h1>

    <p>Scroll down the page to see the notification stay in place.</p>

    <div class="content"> 
        <h2>page Content</h2> 
        <p>This is some content on the page</p>
    </div> 

    <div class="notification">Update Available</div>

</body>
</html>
